-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#49611a">questions</text><text x="40" y="184" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#49611a">with answers</text><text x="210" y="118" font-family="Consolas, SF Mono, Menlo, monospace" font-size="17" font-weight="700" fill="#d26a3c">Q1</text><text x="262" y="118" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#1d1a16">Write a REST call that returns the 10 most</text><text x="262" y="145" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#1d1a16">recently modified open items with the owner&#39;s…</text><line x1="210" y1="182" x2="760" y2="182" stroke="#c6d8a2" stroke-width="1.5"/><text x="210" y="222" font-family="Consolas, SF Mono, Menlo, monospace" font-size="17" font-weight="700" fill="#d26a3c">Q2</text><text x="262" y="222" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#1d1a16">With PnPjs, add an item and then update it in</text><text x="262" y="249" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#1d1a16">one batch with another item.</text><line x1="210" y1="286" x2="760" y2="286" stroke="#c6d8a2" stroke-width="1.5"/><text x="210" y="326" font-family="Consolas, SF Mono, Menlo, monospace" font-size="17" font-weight="700" fill="#d26a3c">Q3</text><text x="262" y="326" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#1d1a16">Write CAML for Status = Open AND DueDate</text><text x="262" y="353" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#1d1a16">before today, ordered by DueDate.</text><line x1="185" y1="88" x2="185" y2="392" stroke="#c6d8a2" stroke-width="1.5"/></svg>